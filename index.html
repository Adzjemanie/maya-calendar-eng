<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Maya Calendar</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Maya Calendar">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0e14">
  <style>
    :root{
      --bg:#0b0e14; --card:#121a2b; --border:#223155;
      --panel:#0f1830; --panelBorder:#2a3c66;
      --text:#e7eeff; --muted:#b1c2ea; --hint:#8ea4d8;
      --accent:#87a7ff; --explain:#d9e4ff; --shadow:rgba(0,0,0,.35);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    body{ margin:0; background:var(--bg); color:var(--text);}
    .wrap{ max-width: 980px; margin: 0 auto; padding: 16px;
      padding-top: calc(16px + env(safe-area-inset-top));
      padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
    .card{ background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 16px; box-shadow: 0 10px 30px var(--shadow); }
    .spacer{ height: 12px; }
    h1{ font-size: 20px; margin: 0 0 6px; }
    p{ margin: 8px 0; color: var(--muted); line-height: 1.45; font-size: 14px; }
    label{ display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
    input, button{
      width:100%; box-sizing:border-box;
      border-radius:12px; border:1px solid var(--panelBorder);
      background: var(--panel); color: var(--text);
      padding: 8px 10px; font-size: 16px;
    }
    input[type="date"]{
      font-size:14px; padding:6px 8px; height:38px; line-height:1.2;
      -webkit-appearance:none; appearance:none;
    }
    input[type="date"]::-webkit-calendar-picker-indicator{ opacity:0.9; padding:0; margin:0; }
    button{ cursor:pointer; background:#152449; }
    button:hover{ filter: brightness(1.08); }
    .btnRow{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    @media (max-width:640px){ .btnRow{ grid-template-columns: 1fr; } }
    .out{ margin-top:10px; padding:10px 12px; border-radius:12px; background: var(--panel); border: 1px solid var(--panelBorder); }
    .title{ font-size: 18px; font-weight: 650; margin: 0 0 6px; }
    .smallmono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 12px; color: var(--muted);}
    .hint{ font-size: 12px; color: var(--hint); line-height: 1.35; margin-top: 8px; }
    .msgTitle{ font-size: 13px; color: var(--accent); font-weight: 650; }
    .msgBody{ margin-top: 10px; color: var(--explain); font-size: 16px; line-height: 1.8; max-width: 44rem; }
    .grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    @media (max-width:640px){ .grid{ grid-template-columns:1fr; } }
    details{ margin-top: 12px; border:1px solid var(--panelBorder); border-radius: 12px; padding: 10px 12px; background:#0b1020; }
    summary{ cursor:pointer; font-size: 13px; color: var(--accent); user-select:none; }
    summary::-webkit-details-marker{ display:none; }
    .tone-line{ margin: 8px 0; color: var(--explain); font-size: 14px; line-height: 1.45; }
    .muted{ color: var(--muted); }
    .chip{ display:inline-block; padding:4px 10px; border:1px solid var(--panelBorder); border-radius:999px; background:#0b1020; color: var(--muted); font-size: 12px; }
  </style>

", "reflection": "What did I learn that I don’t want to forget? Where do I need a reset?", "practice": "Write a short closing note and celebrate one completion. Clear one small space and breathe into it."}, "13-Ajaw": {"title": "13 Ajaw", "theme": "Completion • Integration • Light • Awareness", "message": "Close the cycle. Harvest the lesson and carry it forward. Sun consciousness—illuminate the essential and share your light.", "reflection": "What did I learn that I don’t want to forget? What wants to be seen clearly today?", "practice": "Write a short closing note and celebrate one completion. Choose one essential action and do it fully."}}</script>

<body>
  <div class="wrap">
    <div class="card">
      <h1>Maya Calendar</h1>
      <p>Daily messages follow the Tzolk’in: <b>13 tones</b> × <b>20 day signs</b> = <b>260</b> unique days.</p>

      <!-- 1) Daily message -->
      <div class="out" id="dailyBox" aria-live="polite">
        <div class="title">Daily Message</div>
        <div id="dailyMsg"></div>
      </div>

      <div class="spacer"></div>

      <!-- 2) Date -->
      <label for="date">Date</label>
      <input id="date" type="date" />
      <div class="btnRow">
        <button id="calc">Calculate</button>
        <button id="today">Today</button>
      </div>

      <div class="spacer"></div>

      <!-- 3) Maya birthdate -->
      <label for="birthdate">Maya birthdate</label>
      <input id="birthdate" type="date" />

      <div class="spacer"></div>

      <!-- 4) Find your Maya Birthday -->
      <div class="btnRow">
        <button id="birthBtn">Find your Maya Birthday</button>
        <button id="birthClear">Clear</button>
      </div>

      <div class="out" id="birthBox" aria-live="polite" style="display:none;">
        <div class="title">Maya Birthday</div>
        <div id="birthMsg"></div>
      </div>

      <div class="hint">All 260 messages are embedded in this single file for offline use.</div>
</div>
  </div>

<script>
(() => {
  const MESSAGES = JSON.parse(document.getElementById('tzMsgs').textContent);
  const daySigns = ["Imix", "Ik’", "Ak’b’al", "K’an", "Chikchan", "Kimi", "Manik’", "Lamat", "Muluk", "Ok", "Chuwen", "Eb’", "B’en", "Ix", "Men", "K’ib’", "Kaban", "Etz’nab’", "Kawak", "Ajaw"];

  function pad2(n){ return String(n).padStart(2,'0'); }

  function gregorianToJDN(y, m, d) {
    const a = Math.floor((14 - m) / 12);
    const y2 = y + 4800 - a;
    const m2 = m + 12 * a - 3;
    return d + Math.floor((153 * m2 + 2) / 5) + 365 * y2 + Math.floor(y2 / 4)
      - Math.floor(y2 / 100) + Math.floor(y2 / 400) - 32045;
  }

  function tzolkinFromISO(iso) {
    const [yy, mm, dd] = iso.split('-').map(Number);
    const jdn = gregorianToJDN(yy, mm, dd);
    const correlation = 584283; // GMT
    const daysSince = jdn - correlation;
    const tone = ((daysSince + 3) % 13) + 1;
    const sign = daySigns[(daysSince + 19) % 20];
    const kin = ((daysSince % 260) + 260) % 260 + 1;
    return { tone, sign, kin, key: `${tone}-${sign}` };
  }

  function escapeHtml(s) {
    return String(s)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function renderMessage(targetEl, data, kin=null) {
    const parts = [];
    parts.push(`<div class="msgTitle"><b>${escapeHtml(data.title)}</b></div>`);
    parts.push(`<div class="msgBody"><span class="smallmono">Theme:</span> ${escapeHtml(data.theme)}</div>`);
    if (kin !== null) parts.push(`<div class="msgBody"><span class="chip">Kin ${kin}</span></div>`);
    parts.push(`<div class="msgBody">${escapeHtml(data.message)}</div>`);
    parts.push(`<div class="msgBody"><b>Reflection</b>: ${escapeHtml(data.reflection)}</div>`);
    parts.push(`<div class="msgBody"><b>Practice</b>: ${escapeHtml(data.practice)}</div>`);
    targetEl.innerHTML = parts.join("");
  }

  const elDate = document.getElementById('date');
  const elBirth = document.getElementById('birthdate');
  const dailyMsg = document.getElementById('dailyMsg');
  const birthBox = document.getElementById('birthBox');
  const birthMsg = document.getElementById('birthMsg');

  function setToday(inputEl) {
    const now = new Date();
    inputEl.value = `${now.getFullYear()}-${pad2(now.getMonth()+1)}-${pad2(now.getDate())}`;
  }

  function calcDaily() {
    const iso = elDate.value;
    if (!iso) return;
    const r = tzolkinFromISO(iso);
    const m = MESSAGES[r.key];
    if (m) renderMessage(dailyMsg, m);
    else dailyMsg.textContent = "No message found.";
  }

  function calcBirthday() {
    const iso = elBirth.value;
    if (!iso) return;
    const r = tzolkinFromISO(iso);
    const m = MESSAGES[r.key];
    if (m) {
      birthBox.style.display = "block";
      renderMessage(birthMsg, m, r.kin);
    } else {
      birthBox.style.display = "none";
    }
  }

  document.getElementById('calc').addEventListener('click', calcDaily);
  document.getElementById('today').addEventListener('click', () => { setToday(elDate); calcDaily(); });
  document.getElementById('birthBtn').addEventListener('click', calcBirthday);
  document.getElementById('birthClear').addEventListener('click', () => { elBirth.value=""; birthBox.style.display="none"; });

  setToday(elDate);
  calcDaily();
})();
</script>
